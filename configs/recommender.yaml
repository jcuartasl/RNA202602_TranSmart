# P4 TranSmart: documento de configuración de arquitectura. Para entrenar,
# usar la CLI; tune-neural guarda best_config.json con parámetros utilizados.
# No editar métricas a mano ni entrenar desde la aplicación web.
model: two_tower_pytorch
positive_rating_threshold: 4
k: 5
split_seed: 42
selection_metric: ndcg_at_5
embedding_dim: 8
hidden_dim: 32
latent_dim: 16
dropout: 0.1
learning_rate: 0.005
weight_decay: 0.0001
batch_size: 128
negative_ratio: 2.0  # submuestreo solo entre ratings explícitos 1-3
patience: 4
seeds_required: 30
