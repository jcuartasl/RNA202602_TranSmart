# M1 / P1 — Pronóstico de demanda. Editable sin tocar código (python -m transport_ai.forecasting.cli --config ruta.yaml)

data:
  # Superintendencia de Transporte (datos.gov.co): "Operación de pasajeros y despacho de vehículos
  # en la modalidad de transporte de pasajeros por carretera", recurso eh75-8ah6, CC BY-SA 4.0.
  # Detalle en data/processed/forecasting/DICCIONARIO.md
  raw_path: data/raw/operacion_pasajeros.csv
  processed_dir: data/processed/forecasting
  divipola_path: data/raw/divipola/divipola.csv  # DANE, datos.gov.co recurso gdxc-w37w (descargado 2026-11-27)
  tipo_despacho: ORIGEN          # objetivo: pasajeros despachados desde el origen de la ruta
  inicio: "2021-01-01"           # 2019-2020 y 2025-2026 tienen < 0.1 % de registros; 2024 no existe en el archivo
  fin: "2023-12-31"
  cap_pasajeros_por_despacho: 80 # registro con más pasajeros que esto por despacho = error físico
  seleccion:                     # rutas aptas para modelar (sobre inicio..fin)
    min_cobertura: 0.98          # fracción de días con algún registro
    max_hueco: 3                 # días consecutivos máximos sin registro
    min_media: 100               # pasajeros/día medios
    n_rutas: 20                  # las de mayor volumen entre las aptas (modelo global)

features:
  horizon: 30
  window: 56                     # días de historia (se ajusta en la búsqueda)
  quantiles: [0.75, 0.8, 0.85, 0.9, 0.95]

splits:                          # por fecha de los días OBJETIVO: ninguna ventana cruza dos particiones
  train: ["2021-07-01", "2022-12-31"]  # excluye como objetivo el confinamiento y el paro nacional de 2021-S1
  val:   ["2023-01-01", "2023-06-30"]  # selección de modelos/hiperparámetros (incluye Semana Santa 2023)
  test:  ["2023-07-01", "2023-12-31"]  # solo evaluación final (vacaciones de julio + temporada de diciembre)

train:
  loss: mae                      # mae | poisson (sobre demanda escalada por ruta)
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 256
  max_epochs: 80
  patience: 8
  threads: 4

search:                          # búsqueda aleatoria, 1 semilla por configuración, selección por MASE de validación
  seed: 1000
  budget: {ridge: 8, mlp: 16, gru: 12}
  ridge: {alpha: [0.1, 1, 10, 100], window: [28, 56]}
  mlp:
    window: [28, 56]
    hidden: [[256, 128], [512, 256], [256, 256, 128], [128, 64]]
    dropout: [0.0, 0.1, 0.2, 0.3]
    lr: [0.0003, 0.001, 0.003]
    loss: [mae, poisson]
  gru:
    window: [28, 56]
    hidden: [32, 64, 128]
    layers: [1, 2]
    dropout: [0.0, 0.1, 0.2]
    lr: [0.001, 0.003]
    loss: [mae, poisson]

seeds:
  n: 30
  start: 42
  deploy: 42                     # fijada antes de ver test: el artefacto desplegado es esta semilla

inference:
  model_version: m1-v2
  default_model: auto            # auto = arquitectura con mejor MASE medio de VALIDACIÓN en las 30 semillas
