name: CI · TranSmart AI

on:
  push:
    branches:
      - main
      - develop
      - "p*"
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

jobs:
  test-and-smoke:
    name: Smoke & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -m py_compile app/streamlit_app.py transport_ai/common/mocks.py

      - name: Run tests
        env:
          PYTHONPATH: "."
        run: |
          python -m pytest tests/ -q
